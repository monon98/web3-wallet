name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @plugin/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build extension
        run: pnpm build:extension

      - name: Build web
        run: pnpm build:web

      - name: Build server
        run: pnpm build:server

      - name: Test server
        run: pnpm --filter @plugin/server test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @plugin/shared build

      - name: Install Playwright browsers
        run: pnpm --filter @plugin/e2e exec playwright install --with-deps chromium

      - name: Test Web E2E
        run: pnpm test:e2e

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        working-directory: packages/contracts
        run: forge install --no-commit foundry-rs/forge-std

      - name: Forge test
        working-directory: packages/contracts
        run: forge test -vvv
